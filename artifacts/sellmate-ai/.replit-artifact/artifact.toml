kind = "web"
previewPath = "/"
title = "SellMate AI"
description = "A responsive SaaS sales assistant for online stores to manage products, customers, orders, settings, and AI-assisted sales conversations."
version = "1.0.0"
id = "artifacts/sellmate-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21311

[services.development]
run = "pnpm --filter @workspace/sellmate-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sellmate-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/sellmate-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21311"
BASE_PATH = "/"
